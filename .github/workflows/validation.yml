name: Real-run validation

# Re-diagnoses the public training logs in validation/runs.json and fails if any
# verdict changed. Runs when the code that decides verdicts changes, and weekly
# so an upstream log disappearing is noticed.

on:
  push:
    branches: [main]
    paths:
      - "src/ftdoctor/**"
      - "validation/**"
  pull_request:
    paths:
      - "src/ftdoctor/**"
      - "validation/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: validation/.cache
          key: validation-${{ hashFiles('validation/runs.json') }}
      - run: python validation/fetch.py
      - run: python validation/run.py --check
